<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>資料をお送りしました｜インサイトセールス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161a; --panel:#1e2229; --line:#2c313a;
    --ink:#f4f2ec; --ink-dim:#a7adb8; --ink-mute:#6f7580;
    --amber:#e0a52e; --amber-soft:#f0c261;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(1000px 520px at 82% -10%, rgba(224,165,46,.10), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
    line-height:1.9; letter-spacing:.01em;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;padding:26px 22px 46px}

  /* 1) 大きな四角写真（先頭・主役） */
  .photo{
    position:relative; width:100%; aspect-ratio:1/1;
    border-radius:var(--radius); overflow:hidden;
    background:#22262e; border:1px solid var(--line);
    box-shadow:0 24px 60px rgba(0,0,0,.4), 0 0 0 1px rgba(224,165,46,.10);
  }
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block}
  /* 実写を入れるまでの見えるプレースホルダ（<img>を入れると自動で隠れる） */
  .photo .ph{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;text-align:center;
    color:var(--ink-mute);font-size:13px;line-height:1.8;padding:20px;
  }
  .photo .ph svg{width:52px;height:52px;stroke:var(--ink-mute);fill:none;stroke-width:1.3}
  .photo .ph b{color:var(--ink-dim);font-weight:700;font-size:14px}

  /* 2) 資料送付の一文（小さめ・控えめ） */
  .doc-note{
    margin:20px 2px 0; font-size:13px; color:var(--ink-dim); line-height:1.85;
  }
  .doc-note .subject{color:var(--amber-soft);font-weight:700}
  .doc-note .sub{display:block;color:var(--ink-mute);font-size:12px;margin-top:3px}

  /* 3) 5分の誘い（見出し） */
  .ask{
    margin:22px 0 10px; font-size:clamp(22px,5.6vw,30px); font-weight:900;
    line-height:1.5; letter-spacing:.01em;
  }
  .ask span{color:var(--amber)}
  .reason{margin:0 2px 26px;font-size:14px;color:var(--ink-dim);line-height:1.85}
  .reason b{color:var(--ink);font-weight:700}

  /* 4) TimeRex 予約枠 */
  .book .cap{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
  .book .cap h2{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:500;letter-spacing:.28em;color:var(--amber);text-transform:uppercase}
  .book .cap small{color:var(--ink-mute);font-size:12px}
  .cal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-height:110px}
  .cal .ph{
    border:1px dashed #3a404b;border-radius:10px;padding:26px 18px;
    text-align:center;color:var(--ink-mute);font-size:13px;line-height:1.9;
  }
  .cal .ph code{font-family:"JetBrains Mono",monospace;color:var(--amber-soft);background:rgba(224,165,46,.08);padding:2px 7px;border-radius:5px;font-size:12px}
  #timerex_calendar{width:100%}

  footer{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);color:var(--ink-mute);font-size:12px;line-height:1.85;text-align:center}
  footer b{color:var(--ink-dim);font-weight:700}
  footer a{color:var(--ink-dim);text-decoration:none;border-bottom:1px solid var(--line)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <main class="wrap">

    <!-- 1) 大きな四角写真（担当者）。別の画像に差し替えるには images/tantou.jpg を置き換え -->
    <div class="photo">
      <img src="images/tantou.jpg" alt="担当者">
    </div>

    <!-- 2) 資料送付の一文（差し替え：{{件名}} に実際のメール件名を） -->
    <p class="doc-note">
      サービス資料は<span class="subject">「{{件名}}」</span>の件名で、先ほどメールをお送りしました。
      <span class="sub">数分で届きます。見当たらない場合は迷惑メールフォルダもご確認ください。</span>
    </p>

    <!-- 3) 5分の誘い -->
    <h1 class="ask">このあと、担当者と<span>5分ほど</span>お話ししませんか？</h1>
    <p class="reason">業種と今の課題を5分ほど伺い、<b>貴社専用の100社リスト</b>をお作りします。</p>

    <!-- 4) TimeRex（細かい説明はTimeRex側に表示） -->
    <section class="book">
      <div class="cap"><h2>Booking</h2><small>お電話・約5分</small></div>
      <div class="cal">
        <!-- TimeRex Widget（電話用 5分ヒアリング f4733754） -->
        <div id="timerex_calendar" data-url="https://timerex.net/s/wu/f4733754"></div>
        <script id="timerex_embed" src="https://asset.timerex.net/js/embed.js"></script>
        <script type="text/javascript">TimerexCalendar();</script>
        <!-- End TimeRex Widget -->
      </div>
    </section>

    <footer>
      インサイトセールス（AI×伴走型 新規開拓支援）／運営：<b>株式会社ライトアップ</b>（東証グロース・6580）<br>
      <a href="mailto:w_imai@insight-sales.jp">w_imai@insight-sales.jp</a>
    </footer>

  </main>
  <script>
    (function(){var p=document.querySelector('.photo');if(p&&p.querySelector('img')){var ph=p.querySelector('.ph');if(ph)ph.style.display='none';}})();
  </script>
</body>
</html>
